name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@92148bb48b9a0c5458c53dd0b368fbfbfbaa3210 # main

      - uses: DeterminateSystems/magic-nix-cache-action@b4a9864e3a8ab8179be30f2e70fd71fe9996bb9d # main

      - name: Check flake
        run: nix flake check

      - name: Build kotlin-lsp
        run: nix build .#kotlin-lsp

      - name: Verify binary exists
        run: test -x ./result/bin/kotlin-lsp

      - name: Verify binary version
        run: |
          VERSION="$(jq -r '.version' hashes.json)"
          echo "Expected version from hashes.json: $VERSION"
          if RESULT=$(./result/bin/kotlin-lsp --version 2>&1); then
            echo "Binary --version output: $RESULT"
            # Version output format is unknown; only do strict check if it matches
            if echo "$RESULT" | grep -q "$VERSION"; then
              echo "Version check passed"
            else
              echo "Version output differs from hashes.json — logging only (not failing)"
            fi
          else
            echo "kotlin-lsp --version failed or not supported — skipping version check"
          fi
