queue_rules:
  - name: default
    merge_method: squash

pull_request_rules:
  - name: auto-merge auto-update PRs
    conditions:
      - head=auto-update
      - author=turtton
      - check-success="CI / build (ubuntu-latest)"
      - check-success="CI / build (macos-latest)"
      - check-success="CI / build (macos-15-intel)"
    actions:
      queue:
        name: default
